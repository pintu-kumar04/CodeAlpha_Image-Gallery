<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📸 Image Gallery</h1>
    <p>Explore beautiful images</p>
</header>

<!-- Filter Buttons -->
<div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animal')">Animals</button>
</div>

<!-- Gallery -->
<div class="gallery">

    <div class="gallery-item nature">
        <img src="images/nature1.jpg" alt="Nature" onclick="openLightbox(this)">
    </div>

    <div class="gallery-item nature">
        <img src="images/nature2.jpg" alt="Nature" onclick="openLightbox(this)">
    </div>

    <div class="gallery-item city">
        <img src="images/city1.jpg" alt="City" onclick="openLightbox(this)">
    </div>

    <div class="gallery-item city">
        <img src="images/city2.jpg" alt="City" onclick="openLightbox(this)">
    </div>

    <div class="gallery-item animal">
        <img src="images/animal1.jpg" alt="Animal" onclick="openLightbox(this)">
    </div>

    <div class="gallery-item animal">
        <img src="images/animal2.jpg" alt="Animal" onclick="openLightbox(this)">
    </div>

</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">

    <span class="close" onclick="closeLightbox()">&times;</span>

    <button class="prev" onclick="changeImage(-1)">&#10094;</button>

    <img id="lightbox-img" src="" alt="Preview">

    <button class="next" onclick="changeImage(1)">&#10095;</button>

</div>

<footer>
    <p>© 2026 Image Gallery | HTML • CSS • JavaScript</p>
</footer>

<script src="script.js"></script>

</body>
</html>
